name: Shipit Cloud Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Очистить старый кэш сборки
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer

      - name: Установить системные зависимости
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf automake libtool libtool-bin pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev python3-pip

      - name: Установить Buildozer и Cython
        run: |
          pip3 install --upgrade buildozer
          pip3 install cython==0.29.36 legacy-cgi

      - name: Собрать APK
        run: |
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          export PATH=$PATH:$ANDROID_HOME/tools:$ANDROID_HOME/platform-tools
          buildozer -v android debug

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: warn
